[package]
name = "agent-buddy"
version = "0.1.5"
description = "AI Agents Configuration Manager"
authors = ["senfeng"]
edition = "2021"
# Dock / process display name in `tauri dev` comes from the binary filename.
# Keep the Cargo package name kebab-case; only the runnable target is AgentBuddy.
default-run = "AgentBuddy"

[[bin]]
name = "AgentBuddy"
path = "src/main.rs"

[lib]
name = "agent_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
json5 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "socks", "stream"] }
bytes = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# === Route aggregation (local proxy server) ===
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
