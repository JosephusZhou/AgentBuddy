[package]
name = "agent-buddy"
version = "0.1.3"
description = "AI Agents Configuration Manager"
authors = ["senfeng"]
edition = "2021"
# Dock / process display name in `tauri dev` comes from the binary filename.
# Keep the Cargo package name kebab-case; only the runnable target is AgentBuddy.
default-run = "AgentBuddy"

[[bin]]
name = "AgentBuddy"
path = "src/main.rs"

[lib]
name = "agent_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
json5 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "socks"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
