name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const tagPattern = /^\d+\.\d+\.\d+$/;

          if (!tagPattern.test(version)) {
            throw new Error(`Tag must use vMAJOR.MINOR.PATCH, got v${version}`);
          }

          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = { packageVersion, tauriVersion, cargoVersion };

          for (const [file, actual] of Object.entries(versions)) {
            if (actual !== version) {
              throw new Error(`${file} is ${actual ?? '<missing>'}, expected ${version}`);
            }
          }

          console.log(`Validated release version ${version}`);
          NODE

  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure x86_64 cross-linker
        if: matrix.arch == 'x86_64'
        run: |
          echo '#!/bin/bash' > "$RUNNER_TEMP/x86_64-linker"
          echo 'exec clang -arch x86_64 "$@"' >> "$RUNNER_TEMP/x86_64-linker"
          chmod +x "$RUNNER_TEMP/x86_64-linker"
          echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=$RUNNER_TEMP/x86_64-linker" >> "$GITHUB_ENV"
          echo "CC_x86_64_apple_darwin=clang -arch x86_64" >> "$GITHUB_ENV"
          echo "CXX_x86_64_apple_darwin=clang++ -arch x86_64" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        run: pnpm exec tauri build --target "${{ matrix.target }}" --ci

      - name: Rename DMG
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          DMG_DIR="src-tauri/target/${TARGET}/release/bundle/dmg"
          DMG="$(find "$DMG_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          mv "$DMG" "AgentBuddy_${VERSION}_${ARCH}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: AgentBuddy_${{ needs.validate.outputs.version }}_${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows NSIS
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri.windows.conf.json is auto-merged on Windows (title bar + nsis target).
      - name: Build Tauri application (NSIS)
        run: pnpm exec tauri build --bundles nsis --ci

      - name: Rename installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          )
          $installer = $null
          foreach ($dir in $candidates) {
            if (Test-Path $dir) {
              $found = Get-ChildItem -Path $dir -Filter *.exe -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($found) {
                $installer = $found.FullName
                break
              }
            }
          }
          if (-not $installer) {
            throw "NSIS installer (.exe) not found under bundle/nsis"
          }
          $out = "AgentBuddy_${env:VERSION}_x64-setup.exe"
          Move-Item -LiteralPath $installer -Destination $out -Force
          Write-Host "Prepared $out"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: AgentBuddy_${{ needs.validate.outputs.version }}_x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: artifacts
          merge-multiple: true

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "AgentBuddy $TAG_NAME" \
              --generate-notes
          fi
          gh release upload "$TAG_NAME" artifacts/* --clobber